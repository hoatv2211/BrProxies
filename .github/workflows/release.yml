# Build BrProxies for macOS arm64, Windows x64, and Linux x64,
# then attach bundles to a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.3). Required for manual runs.'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python 3.11 for ProxyPool
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: proxypool_service/pyproject.toml

      - name: Set up Rust (stable, ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: npm install
        run: npm ci

      - name: Build Tauri bundle (unsigned)
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} staging/ \;
          ls -la staging/

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brproxies-${{ matrix.label }}
          path: staging/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: publish release
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download every per-platform artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected bundles
        run: ls -la dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: BrProxies ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            * **macOS** (Apple Silicon) - download the `.dmg`. First launch: right-click *BrProxies.app* -> *Open* -> *Open*.
            * **Windows** - download the `.msi` installer. SmartScreen may warn: *More info* -> *Run anyway*.
            * **Linux** - use the `.AppImage` (`chmod +x` and run) or `.deb` (`sudo apt install ./...deb`).

            Builds are unsigned.
          files: dist/*
